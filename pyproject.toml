[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-bloat"
version = "0.1.0"
description = "Audit and optimize token bloat in AI agent repositories"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Deivy", email = "buildwith.crow@gmail.com" }]
keywords = ["ai", "agents", "context", "tokens", "claude", "cursor", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
context-bloat = "context_bloat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/context_bloat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
